name: Sync from htlinnrain/python
on:
  schedule:
    # Every 6 hours
    - cron: "0 */6 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sync-upstream
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - name: Pull from upstream and push
        env:
          UPSTREAM_URL: https://github.com/htlinnrain/python.git
          UPSTREAM_BRANCH: master
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote remove upstream 2>/dev/null || true
          git remote add upstream "$UPSTREAM_URL"
          git fetch upstream "$UPSTREAM_BRANCH"
          BEFORE="$(git rev-parse HEAD)"
          if git merge-base --is-ancestor HEAD "upstream/$UPSTREAM_BRANCH"; then
            git merge --ff-only "upstream/$UPSTREAM_BRANCH"
          else
            git merge --no-edit "upstream/$UPSTREAM_BRANCH"
          fi
          AFTER="$(git rev-parse HEAD)"
          if [ "$BEFORE" = "$AFTER" ]; then
            echo "Already up to date with upstream."
            exit 0
          fi
          git push origin "HEAD:master"
          echo "Synced $BEFORE -> $AFTER"
